spring:
  application:
    name: smart-resume-screener

  datasource:
    # H2 rejects AUTO_SERVER together with DB_CLOSE_ON_EXIT, so the app keeps the second one:
    # Spring closes the datasource on shutdown, and the H2 console runs inside this JVM anyway.
    url: jdbc:h2:file:./data/screener;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 25

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  llm:
    # Set GEMINI_API_KEY to enable model-based extraction and scoring.
    # Without it the service still runs, using the deterministic engine.
    enabled: true
    provider: gemini
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    base-url: https://generativelanguage.googleapis.com/v1beta
    timeout: 45s
    max-retries: 2
    temperature: 0.2
    # Newer Gemini models spend output tokens on internal reasoning before emitting the JSON,
    # so a tight cap truncates the answer and the parse fails. 8192 leaves comfortable headroom.
    max-output-tokens: 8192
    max-input-characters: 18000

  upload:
    max-file-size-bytes: 5242880
    max-files-per-request: 25
    allowed-extensions:
      - pdf
      - txt
      - md

  scoring:
    skill-weight: 0.60
    experience-weight: 0.25
    education-weight: 0.15
    shortlist-threshold: 7.0

logging:
  level:
    root: INFO
    com.vamsi.screener: INFO
